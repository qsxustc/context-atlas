name: Feature request
description: Suggest an improvement to preparing repository context.
title: "[Feature]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the real workflow or task this would improve.
      placeholder: "When preparing context for ..., I currently have to ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Explain the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
      description: How do you handle this today?
  - type: textarea
    id: example
    attributes:
      label: Example or additional context
      description: Use public or synthetic examples and remove private information.
