<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Context Atlas — Make room for what matters.</title>
  <desc id="description">Visual context builder for AI coding. Local by design, fits your budget, and zero dependencies. A colorful repository treemap and an estimated context budget illustrate the app.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111519"/>
      <stop offset="1" stop-color="#171d20"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9ee9d" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="636" y="108" width="644" height="532" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(60 46)">
      <rect width="30" height="30" rx="7" fill="#d9ee9d"/>
      <rect x="6" y="6" width="9" height="18" rx="1" fill="#111519"/>
      <rect x="17" y="6" width="7" height="8" rx="1" fill="#111519"/>
      <rect x="17" y="16" width="7" height="8" rx="1" fill="#111519"/>
      <text x="44" y="23" font-size="25" font-weight="600" letter-spacing="-.7" fill="#f2f5ec">Context Atlas</text>
    </g>
    <text x="1220" y="67" text-anchor="end" font-size="12" font-weight="500" letter-spacing="2" fill="#89928f">YOUR CODE. YOUR CONTEXT.</text>
    <path d="M60 104H1220" stroke="#30383b"/>

    <text x="60" y="170" font-size="11" font-weight="600" letter-spacing="2.6" fill="#d9ee9d">LESS NOISE. BETTER CONTEXT.</text>
    <text x="57" y="245" font-size="62" font-weight="600" letter-spacing="-2.5" fill="#f2f5ec">Make room for</text>
    <text x="57" y="319" font-size="62" font-weight="600" letter-spacing="-2.5" fill="#d9ee9d">what matters.</text>
    <text x="60" y="375" font-size="23" letter-spacing="-.3" fill="#a9b2ad">Visual context builder for AI coding.</text>

    <g transform="translate(60 414)">
      <rect width="151" height="35" rx="17.5" fill="#1b2225" stroke="#394237"/>
      <circle cx="16" cy="17.5" r="3" fill="#d9ee9d"/>
      <text x="27" y="22" font-size="12" fill="#dce3d4">Local by design</text>
      <rect x="161" width="151" height="35" rx="17.5" fill="#1b2225" stroke="#394237"/>
      <circle cx="177" cy="17.5" r="3" fill="#d9ee9d"/>
      <text x="188" y="22" font-size="12" fill="#dce3d4">Fits your budget</text>
      <rect x="322" width="153" height="35" rx="17.5" fill="#1b2225" stroke="#394237"/>
      <circle cx="338" cy="17.5" r="3" fill="#d9ee9d"/>
      <text x="349" y="22" font-size="12" fill="#dce3d4">Zero dependencies</text>
    </g>
    <path d="M60 496H106" stroke="#6c785b" stroke-width="2"/>
    <text x="60" y="532" font-size="15" fill="#909b94">See the files. Shape the prompt.</text>
    <text x="60" y="589" font-size="12" letter-spacing=".4" fill="#68736e">OPEN SOURCE / MIT / BROWSER + CLI</text>

    <g transform="translate(650 140)">
      <rect x="8" y="12" width="570" height="410" rx="15" fill="#080c0e" opacity=".45"/>
      <rect width="570" height="410" rx="15" fill="#191f23" stroke="#394247"/>
      <path d="M0 57H570" stroke="#323b3f"/>
      <g transform="translate(22 24)" fill="none" stroke="#8e9b91" stroke-width="1.5">
        <path d="M0 2h8l3 3h9v13H0Z" stroke-linejoin="round"/>
      </g>
      <text x="52" y="37" font-size="15" font-weight="500" fill="#ecf0e8">orbit-notes</text>
      <text x="548" y="36" text-anchor="end" font-size="11" fill="#8d9991">24 files / local project</text>

      <g transform="translate(22 79)">
        <rect width="240" height="129" rx="5" fill="#4d6c83"/>
        <text x="16" y="30" font-size="18" font-weight="600" fill="#e2edf4">App.tsx</text>
        <text x="16" y="50" font-size="11" fill="#c1d0dc">src</text>
        <text x="16" y="108" font-size="12" fill="#d8e5ef">~8.2k tokens</text>
        <rect x="208" y="14" width="18" height="18" rx="4" fill="#d9ee9d"/>
        <path d="m212 23 3 3 7-8" fill="none" stroke="#26372b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="246" width="136" height="129" rx="5" fill="#80976a"/>
        <text x="260" y="30" font-size="14" font-weight="600" fill="#f0f5e5">README.md</text>
        <text x="260" y="50" font-size="11" fill="#dce5cb">root</text>
        <text x="260" y="108" font-size="12" fill="#eaf0df">~2.4k tokens</text>

        <rect x="388" width="138" height="129" rx="5" fill="#656289"/>
        <text x="402" y="30" font-size="14" font-weight="600" fill="#efebfa">global.css</text>
        <text x="402" y="50" font-size="11" fill="#d2cce6">src/styles</text>
        <text x="402" y="108" font-size="12" fill="#e3ddf2">~3.8k tokens</text>

        <rect y="135" width="160" height="81" rx="5" fill="#92865b"/>
        <text x="14" y="160" font-size="13" font-weight="600" fill="#f7f0d5">package.json</text>
        <text x="14" y="196" font-size="11" fill="#ece3c2">~1.1k tokens</text>

        <rect x="166" y="135" width="140" height="81" rx="5" fill="#4b8584"/>
        <text x="180" y="160" font-size="13" font-weight="600" fill="#dbf6f4">storage.ts</text>
        <text x="180" y="196" font-size="11" fill="#c4e9e5">~2.7k tokens</text>

        <rect x="312" y="135" width="122" height="81" rx="5" fill="#4d6c83"/>
        <text x="324" y="160" font-size="12" font-weight="600" fill="#e2edf4">useNotes.ts</text>
        <text x="324" y="196" font-size="11" fill="#c5d8e5">~2.3k tokens</text>

        <rect x="440" y="135" width="86" height="81" rx="5" fill="#505d65"/>
        <text x="450" y="160" font-size="12" font-weight="500" fill="#d3dde0">types.ts</text>
        <text x="450" y="196" font-size="10" fill="#a5b4bc">excluded</text>
      </g>

      <text x="22" y="326" font-size="10" font-weight="600" letter-spacing="1.7" fill="#b2bdb4">CONTEXT BUDGET</text>
      <text x="548" y="326" text-anchor="end" font-size="11" fill="#a4b294">32,000</text>
      <rect x="22" y="341" width="526" height="7" rx="3.5" fill="#303c35"/>
      <rect x="22" y="341" width="352" height="7" rx="3.5" fill="#d9ee9d"/>
      <text x="22" y="376" font-size="13" fill="#dce8cd">~21.4k estimated tokens</text>
      <text x="548" y="376" text-anchor="end" font-size="11" fill="#8f9f8b">Room for your instructions</text>
    </g>
  </g>
</svg>
